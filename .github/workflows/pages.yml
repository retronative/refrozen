# Builds the reFrozen website (.website/, reading docs/ at build time) and deploys it to
# GitHub Pages. Requires Pages to be enabled with "GitHub Actions" as the source.
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - ".website/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .website
    env:
      # Project page: https://<owner>.github.io/refrozen/. For a custom domain set the
      # repository variables SITE_BASE=/ , SITE_URL=https://<domain> and SITE_CNAME=<domain>.
      SITE_BASE: ${{ vars.SITE_BASE || '/refrozen/' }}
      SITE_CNAME: ${{ vars.SITE_CNAME || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: .website/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check, build, check links and artifact
        run: npm run validate
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
